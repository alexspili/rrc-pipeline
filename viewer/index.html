<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Texas Railroad Commission completion reports: extraction viewer</title>
    <meta
      name="description"
      content="Values extracted from Texas Railroad Commission well records, located on the page images at a tagged confidence tier. Scanned paper, 1950s to 2000s."
    />

    <!-- Social preview. og:image must be absolute and same-origin: the image
         is emitted into the build by vite.config.ts, not linked from raw
         GitHub, so nothing outside this deployment can break the card. -->
    <meta
      property="og:title"
      content="Texas Railroad Commission completion reports: extraction viewer"
    />
    <meta
      property="og:description"
      content="Values extracted from Texas Railroad Commission well records, located on the page images at a tagged confidence tier. Scanned paper, 1950s to 2000s."
    />
    <meta
      property="og:image"
      content="https://alexspili.github.io/rrc-pipeline/og-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://alexspili.github.io/rrc-pipeline/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
